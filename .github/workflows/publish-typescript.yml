name: Publish TypeScript SDK

# Two-stage release for @appconnecthq/sdk. npm versions are immutable, so:
#   1. A version bump pushed to main publishes automatically to npm.w3api.dev.
#   2. After verifying it there, run this workflow manually with
#      registry=npmjs to promote the same version to npmjs.com. Promotion
#      refuses versions that stage 1 hasn't published.
#
# npm.w3api.dev uses the NPM_TOKEN secret. npmjs.com uses npm Trusted
# Publishing (GitHub OIDC, provenance generated automatically). No token is
# stored for it: the @appconnecthq/sdk package lists this repo, this
# workflow file, and the "npmjs" environment as its trusted publisher.
# Trusted Publishing needs npm >= 11.5.1 and GitHub-hosted runners. Add
# required reviewers to the "npmjs" environment to gate stage 2.

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry to publish to"
        required: true
        default: "w3api"
        type: choice
        options:
          - w3api
          - npmjs
      tag:
        description: "npm dist-tag"
        required: false
        default: "latest"
        type: choice
        options:
          - latest
          - next
          - beta
      dry_run:
        description: "Build and check without publishing"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - "typescript/**"
      - ".github/workflows/publish-typescript.yml"

concurrency:
  group: publish-typescript
  cancel-in-progress: false

permissions:
  contents: read

env:
  W3API_REGISTRY: https://npm.w3api.dev/
  NPMJS_REGISTRY: https://registry.npmjs.org/

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      version: ${{ steps.decide.outputs.version }}
      registry: ${{ steps.decide.outputs.registry }}
      tag: ${{ steps.decide.outputs.tag }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./typescript/package.json').version")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REGISTRY="$INPUT_REGISTRY"; TAG="$INPUT_TAG"; DRY_RUN="$INPUT_DRY_RUN"
            SHOULD_PUBLISH="true"; REASON="manual workflow_dispatch trigger"
          else
            # Compare against github.event.before (not HEAD~1) so a version
            # bump followed by other commits in the same push is still seen.
            PREV_VERSION="__NONE__"
            if [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              PREV_VERSION=$(git show "$BEFORE_SHA:typescript/package.json" 2>/dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "__NONE__")
            fi
            REGISTRY="w3api"; TAG="latest"; DRY_RUN="false"
            if [ "$PREV_VERSION" = "__NONE__" ]; then
              # No comparable previous commit (e.g. the repository's first
              # push): never auto-publish without an observed version bump.
              SHOULD_PUBLISH="false"; REASON="no baseline commit to compare; publish manually if needed"
            elif [ "$PREV_VERSION" = "$VERSION" ]; then
              SHOULD_PUBLISH="false"; REASON="version unchanged ($VERSION)"
            else
              SHOULD_PUBLISH="true"; REASON="version changed ($PREV_VERSION -> $VERSION)"
            fi
          fi

          echo "Decision: should_publish=$SHOULD_PUBLISH version=$VERSION registry=$REGISTRY tag=$TAG dry_run=$DRY_RUN ($REASON)"
          {
            echo "should_publish=$SHOULD_PUBLISH"
            echo "version=$VERSION"
            echo "registry=$REGISTRY"
            echo "tag=$TAG"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## TypeScript SDK publish gate"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Registry | \`$REGISTRY\` |"
            echo "| Dist-tag | \`$TAG\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Should publish | \`$SHOULD_PUBLISH\` |"
            echo "| Reason | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.gate.outputs.registry }}
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) on npmjs.com
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Write .npmrc (outside the checkout)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY: ${{ needs.gate.outputs.registry }}
        run: |
          set -euo pipefail
          # npm.w3api.dev serves reads anonymously, so NPM_TOKEN is only
          # required to publish there. npmjs.com authenticates via OIDC, so
          # no npmjs token is written.
          if [ "$REGISTRY" = "w3api" ] && [ -z "$NPM_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN is not set (needed to publish to npm.w3api.dev)"
            exit 1
          fi
          NPMRC_PATH="$RUNNER_TEMP/.npmrc"
          {
            if [ -n "$NPM_TOKEN" ]; then
              echo "//npm.w3api.dev/:_authToken=\${NPM_TOKEN}"
            fi
          } > "$NPMRC_PATH"
          echo "NPMRC_PATH=$NPMRC_PATH" >> "$GITHUB_ENV"

      - name: Check registry state
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY: ${{ needs.gate.outputs.registry }}
          PKG_VERSION: ${{ needs.gate.outputs.version }}
          DRY_RUN: ${{ needs.gate.outputs.dry_run }}
        run: |
          set -uo pipefail
          exists() {
            npm view "@appconnecthq/sdk@$PKG_VERSION" version --registry="$1" --userconfig="$NPMRC_PATH" 2>/dev/null | grep -qx "$PKG_VERSION"
          }
          fail_or_warn() {
            if [ "$DRY_RUN" = "true" ]; then echo "::warning::$1 (continuing: dry run)"; else echo "::error::$1"; exit 1; fi
          }

          if [ "$REGISTRY" = "npmjs" ]; then
            TARGET="$NPMJS_REGISTRY"
            if ! exists "$W3API_REGISTRY"; then
              fail_or_warn "@appconnecthq/sdk@$PKG_VERSION is not on npm.w3api.dev yet. Publish and verify it there before promoting to npmjs.com."
            fi
          else
            TARGET="$W3API_REGISTRY"
          fi
          if exists "$TARGET"; then
            fail_or_warn "@appconnecthq/sdk@$PKG_VERSION already exists on $TARGET. Bump the version in typescript/package.json."
          fi
          echo "TARGET_REGISTRY=$TARGET" >> "$GITHUB_ENV"

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY: ${{ needs.gate.outputs.registry }}
          NPM_TAG: ${{ needs.gate.outputs.tag }}
          DRY_RUN: ${{ needs.gate.outputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--registry="$TARGET_REGISTRY" --tag "$NPM_TAG" --access public --userconfig="$NPMRC_PATH")
          # On npmjs.com, Trusted Publishing adds provenance automatically.
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          npm publish "${ARGS[@]}"

      - name: Remove .npmrc
        if: always()
        run: rm -f "${NPMRC_PATH:-/nonexistent}"

      - name: Write summary
        env:
          PKG_VERSION: ${{ needs.gate.outputs.version }}
          NPM_TAG: ${{ needs.gate.outputs.tag }}
          DRY_RUN: ${{ needs.gate.outputs.dry_run }}
        run: |
          MODE="Published"; [ "$DRY_RUN" = "true" ] && MODE="Dry run (nothing was published)"
          {
            echo "## TypeScript SDK publish"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`@appconnecthq/sdk@$PKG_VERSION\` |"
            echo "| Registry | $TARGET_REGISTRY |"
            echo "| Dist-tag | \`$NPM_TAG\` |"
            echo "| Mode | $MODE |"
          } >> "$GITHUB_STEP_SUMMARY"
