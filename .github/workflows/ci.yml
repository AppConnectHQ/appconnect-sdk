name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check generated API reference is current
        run: |
          bun run docs:api
          test -z "$(git status --porcelain -- ../docs/reference/typescript)" \
            || { git status --short -- ../docs/reference/typescript; echo "::error::docs/reference/typescript is stale. Run 'bun run docs:api' in typescript/ and commit."; exit 1; }

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Build and check distributions
        run: |
          uv build
          uvx twine check --strict dist/*

      - name: Check generated API reference is current
        if: matrix.python-version == '3.13'
        run: |
          uv run python scripts/generate_api_reference.py
          test -z "$(git status --porcelain -- ../docs/reference/python)" \
            || { git status --short -- ../docs/reference/python; echo "::error::docs/reference/python is stale. Run 'uv run --python 3.13 python scripts/generate_api_reference.py' in python/ and commit."; exit 1; }
